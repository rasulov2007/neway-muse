<!doctype html>
<!--
  The driver's consent (/consent/#token=…, owner brief 2026-10-11). Its own Vite entry like dot.html,
  drawn with the TMS's Porcelain tokens in the light theme (a public page has no account to carry an
  appearance choice). The token in the fragment is the only key: no referrer is sent anywhere,
  search engines are asked not to index it, and nothing is stored in the browser.
-->
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Driver consents</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/consent/main.tsx"></script>
  </body>
</html>
