<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NeWay TMS × Meta Muse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="card.css">
<style>
  h1 { font-size: 112px; font-weight: 800; letter-spacing: -0.035em; line-height: 1; margin-top: 44px; }
  h1 .x { color: var(--nw-text-3); font-weight: 500; margin: 0 28px; }
  h1 .muse { color: var(--nw-accent); }
  .sub { margin-top: 40px; font-size: 34px; font-weight: 600; color: var(--nw-text-2); }
  .cos { margin-top: 34px; display: flex; gap: 20px; }
  .co { display: flex; align-items: baseline; gap: 14px; padding: 18px 28px; background: var(--nw-panel); border: 1px solid var(--nw-border); border-radius: 10px; font-size: 30px; font-weight: 700; }
  .co span { font-size: 24px; font-weight: 600; color: var(--nw-accent-ink); background: var(--nw-accent-tint); padding: 4px 12px; border-radius: 999px; }
  .live { display: inline-flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 700; color: var(--nw-accent-ink); text-transform: uppercase; letter-spacing: 0.12em; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--nw-accent); }
</style>
</head>
<body>
<div class="stage">
  <div class="brand rise d1">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg></div>
  </div>
  <h1 class="rise d2">NeWay TMS<span class="x">×</span><span class="muse">Meta Muse</span></h1>
  <p class="sub rise d3">Running every day at</p>
  <div class="cos rise d4">
    <div class="co">USA Silk Way <span>120 trucks</span></div>
    <div class="co">A&amp;J Silk Road <span>4 trucks</span></div>
  </div>
  <p class="foot rise d5"><span class="live"><span class="dot"></span>A real TMS in daily use</span></p>
</div>
</body>
</html>
