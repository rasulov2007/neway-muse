<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NeWay AI × Meta Muse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="card.css">
<style>
  .logo { display: flex; align-items: center; gap: 26px; }
  .logo .mark { width: 104px; height: 104px; border-radius: 26px; }
  .logo .mark svg { width: 58px; height: 58px; }
  .logo .word { font-size: 104px; font-weight: 800; letter-spacing: -0.04em; }
  .tag { margin-top: 26px; font-size: 44px; font-weight: 700; color: var(--nw-text-2); }
  .tag b { color: var(--nw-accent); font-weight: 800; }
  .nums { margin-top: 64px; display: grid; grid-template-columns: 420px 400px 300px 300px; gap: 22px; }
  .num { background: var(--nw-panel); border: 1px solid var(--nw-border); border-radius: 10px; padding: 26px 26px 24px; box-shadow: var(--nw-shadow-menu); }
  .num .v { font-size: 50px; font-weight: 800; letter-spacing: -0.02em; color: var(--nw-accent-ink); white-space: nowrap; }
  .num .v small { font-size: 30px; color: var(--nw-text-3); font-weight: 700; }
  .num .k { margin-top: 8px; font-size: 24px; font-weight: 600; color: var(--nw-text-2); }
</style>
</head>
<body>
<div class="stage">
  <div class="logo rise d1">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg></div>
    <div class="word">NeWay</div>
  </div>
  <p class="tag rise d2">NeWay AI × <b>Meta Muse</b></p>
  <div class="nums">
    <div class="num rise d3"><div class="v">5–10 min <small>→</small> 7 s</div><div class="k">per rate confirmation</div></div>
    <div class="num rise d4"><div class="v">2–3 min <small>→</small> 6 s</div><div class="k">per CDL check</div></div>
    <div class="num rise d5"><div class="v">120</div><div class="k">trucks at USA Silk Way</div></div>
    <div class="num rise d6"><div class="v">~90</div><div class="k">loads a month</div></div>
  </div>
</div>
</body>
</html>
